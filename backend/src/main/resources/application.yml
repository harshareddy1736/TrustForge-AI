server:
  port: 8080
spring:
  application:
    name: trustforge-api
  datasource:
    url: jdbc:h2:file:./data/trustforge;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
trustforge:
  analysis-url: ${ANALYSIS_SERVICE_URL:http://127.0.0.1:8000}
